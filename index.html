
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Emergency Healthcare Finder</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Main Website Container -->

    <div class="container">

        <!-- Website Heading -->

        <h1>Smart Emergency Healthcare Finder</h1>

        <p class="subtitle">
            Find suitable emergency healthcare facilities
        </p>

        <!-- Patient Information Form -->

        <form action="/find-hospital" method="POST">

            <h2>Patient Information</h2>

            <!-- Patient Name -->

            <label for="name">Patient Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter patient name"
                required
            >

            <!-- Patient Location -->

            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter your city or area"
                required
            >

            <!-- Patient Age -->

            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                name="age"
                min="0"
                max="120"
                placeholder="Enter age"
                required
            >

            <!-- Symptoms -->

            <label for="symptoms">Describe Symptoms</label>

            <textarea
                id="symptoms"
                name="symptoms"
                placeholder="Describe your symptoms"
                required
            ></textarea>

            <!-- Emergency Conditions -->

            <h2>Emergency Conditions</h2>

            <div class="checkbox-group">

                <label>
                    <input
                        type="checkbox"
                        name="breathing"
                        value="yes"
                    >
                    Difficulty in breathing
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="unconscious"
                        value="yes"
                    >
                    Patient is unconscious
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="bleeding"
                        value="yes"
                    >
                    Severe bleeding
                </label>

            </div>

            <!-- Submit Button -->

            <button type="submit">
                Find Hospital
            </button>

        </form>

        <!-- Emergency Notice -->

        <p class="note">
            Educational demonstration only.
            For a real emergency in India, call 112.
        </p>

    </div>

</body>

</html>
